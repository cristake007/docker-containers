name: symfony-backend

services:
  backend:
    image: symfony-backend:prod
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: prod
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5.9}
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    expose:
      - "9000"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
