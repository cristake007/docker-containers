name: symfony-backend

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backend:
    image: symfony-backend:prod
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: prod
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5.9}
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?serverVersion=17&charset=utf8
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      JWT_COOKIE_SECURE: "1"
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
    # Bound to loopback only: the host's own nginx reverse-proxies to this
    # FastCGI port (see deploy/nginx/app.prod.conf.example). Never publish
    # this on a non-loopback address -- PHP-FPM is not an HTTP server and
    # has no request validation of its own.
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - backend_jwt:/var/www/html/config/jwt
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

volumes:
  db_data:
  backend_jwt:
