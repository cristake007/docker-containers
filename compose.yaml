name: symfony-backend

services:
  db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backend:
    # A real registry reference, not just a local tag: `docker compose -f
    # compose.yaml up --build` still builds locally same as always (and
    # tags the result with this name), but a prod host with no git checkout
    # at all can now instead run `docker compose -f compose.yaml pull` to
    # fetch the image .github/workflows/publish-images.yml publishes on
    # every push to main. Override IMAGE_TAG to pin a specific build
    # instead of always floating on latest.
    image: ghcr.io/cristake007/docker-containers-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: prod
      args:
        # The base image is pinned by digest in docker/backend/Dockerfile
        # for that exact tag -- overriding PHP_VERSION here without also
        # updating that digest will fail the build on purpose rather than
        # silently pull an unpinned image.
        PHP_VERSION: ${PHP_VERSION:-8.5.9}
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET}
      # Discrete connection parameters, not an assembled DATABASE_URL: see
      # the comment in backend/config/packages/doctrine.yaml for why.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      JWT_COOKIE_SECURE: "1"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
    # Bound to loopback only: the host's own nginx reverse-proxies to this
    # FastCGI port (see deploy/nginx/app.prod.conf.example). Never publish
    # this on a non-loopback address -- PHP-FPM is not an HTTP server and
    # has no request validation of its own.
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - backend_jwt:/var/www/html/config/jwt
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

volumes:
  db_data:
  backend_jwt:
