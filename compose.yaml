name: symfony-backend

services:
  backend:
    image: symfony-backend:prod
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: prod
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5.9}
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    ports:
      - "127.0.0.1:8000:80"
    restart: unless-stopped
