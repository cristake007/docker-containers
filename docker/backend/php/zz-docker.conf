; PHP-FPM defaults to clear_env=yes, which strips the container's
; environment (DATABASE_URL, JWT_PASSPHRASE, etc.) from every worker before
; Symfony ever sees it, silently falling back to the placeholder values
; committed in .env. Docker Compose is the only source of these variables
; here, so it's safe -- and necessary -- to let them through.
[www]
clear_env = no
