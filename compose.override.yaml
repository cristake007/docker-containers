services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    image: symfony-backend:dev
    build:
      target: dev
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      JWT_COOKIE_SECURE: "0"
    restart: "no"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_var:/var/www/html/var

  frontend:
    image: frontend:dev
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: dev
    environment:
      VITE_API_URL: /api
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: "no"
    init: true

volumes:
  backend_vendor:
  backend_var:
  frontend_node_modules:
