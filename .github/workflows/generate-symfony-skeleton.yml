name: Commit Symfony skeleton

on:
  pull_request:
    paths:
      - ".github/workflows/generate-symfony-skeleton.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: backend-simplification

      - name: Generate and commit Symfony 8.1 skeleton
        run: |
          set -eu
          rm -rf backend
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/app" \
            --workdir /app \
            composer:2.10.2 \
            create-project symfony/skeleton:"8.1.*" backend \
            --prefer-dist \
            --no-interaction \
            --no-progress

          rm -rf backend/vendor backend/var
          rm -f backend/config/reference.php
          printf '\n/config/reference.php\n' >> backend/.gitignore

          git config user.name github-actions
          git config user.email github-actions@github.com
          git add backend
          git commit -m "Commit Symfony 8.1 skeleton"
          git push origin HEAD:backend-simplification
