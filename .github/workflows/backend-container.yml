name: Backend container

on:
  pull_request:
    paths:
      - "backend/**"
      - "docker/backend/**"
      - "compose.yaml"
      - "compose.override.yaml"
      - ".env"
      - "tests/backend-smoke.sh"
      - ".github/workflows/backend-container.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker/backend/**"
      - "compose.yaml"
      - "compose.override.yaml"
      - ".env"
      - "tests/backend-smoke.sh"
      - ".github/workflows/backend-container.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh tests/backend-smoke.sh
