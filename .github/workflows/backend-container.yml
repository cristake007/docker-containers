name: Backend container

on:
  pull_request:
    paths:
      - "backend/**"
      - "docker/backend/**"
      - "compose.yaml"
      - "compose.override.yaml"
      - ".env"
      - "tests/backend-smoke.sh"
      - ".github/workflows/backend-container.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker/backend/**"
      - "compose.yaml"
      - "compose.override.yaml"
      - ".env"
      - "tests/backend-smoke.sh"
      - ".github/workflows/backend-container.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
      - run: sh tests/backend-smoke.sh
      # TEMPORARY: diagnosing an exit-137 (SIGKILL) seen right after the
      # backend container starts. Remove once the cause is confirmed.
      - name: Dump memory samples (debug)
        if: always()
        run: cat /tmp/meminfo.log || true
