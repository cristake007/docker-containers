name: Stack smoke test

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "deploy/nginx/**"
      - "compose.yaml"
      - "compose.override.yaml"
      - ".env"
      - "tests/stack-smoke.sh"
      - ".github/workflows/stack-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "deploy/nginx/**"
      - "compose.yaml"
      - "compose.override.yaml"
      - ".env"
      - "tests/stack-smoke.sh"
      - ".github/workflows/stack-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: sh tests/stack-smoke.sh
