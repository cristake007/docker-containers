name: Stack smoke test

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "deploy/nginx/**"
      - "compose.yaml"
      - "compose.override.yaml"
      - ".env"
      - "tests/stack-smoke.sh"
      - ".github/workflows/stack-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "deploy/nginx/**"
      - "compose.yaml"
      - "compose.override.yaml"
      - ".env"
      - "tests/stack-smoke.sh"
      - ".github/workflows/stack-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh tests/stack-smoke.sh
