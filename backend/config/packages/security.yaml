security:
    password_hashers:
        App\Entity\User: 'auto'

    providers:
        # No `property:` here on purpose: that option forces an exact-match
        # lookup, which would make login case-sensitive on email. Omitting
        # it makes Symfony call App\Repository\UserRepository::loadUserByIdentifier
        # instead, which compares case-insensitively.
        app_user_provider:
            entity:
                class: App\Entity\User

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            # Bounds password-guessing/credential-stuffing against the single
            # admin account. Limits are keyed by username + client IP, so a
            # remote attacker can't lock out the legitimate admin by hammering
            # from elsewhere.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        api:
            pattern: ^/api
            stateless: true
            jwt: ~
            logout:
                path: /api/logout

    # There is no public registration: the only account is the admin seeded
    # by App\Command\BootstrapAdminCommand from ADMIN_EMAIL / ADMIN_PASSWORD
    # (see README). Only the login path itself needs to be public.
    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
