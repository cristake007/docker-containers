doctrine:
    dbal:
        # Discrete connection parameters rather than a single DATABASE_URL:
        # a URL has to be assembled by percent-encoding each component, and
        # Docker Compose variable interpolation cannot do that -- a
        # POSTGRES_PASSWORD containing a URI-reserved character (`@`, `:`,
        # `/`, `?`, `#`, `%`) would silently change the parsed host, path,
        # or password. Passing each value straight through as its own
        # parameter has no such parsing step.
        driver: pdo_pgsql
        host: '%env(POSTGRES_HOST)%'
        port: '%env(int:POSTGRES_PORT)%'
        dbname: '%env(POSTGRES_DB)%'
        user: '%env(POSTGRES_USER)%'
        password: '%env(POSTGRES_PASSWORD)%'
        server_version: '17'
        charset: utf8

        profiling_collect_backtrace: '%kernel.debug%'
        types:
            uuid: Symfony\Bridge\Doctrine\Types\UuidType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
